[project]
name = "clifra-model-bench"
version = "0.1.0"
description = "Paired fixed-model benchmarks for established geometric models and Clifra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cliffordlayers",
    "clifra>=2.0.3",
    "einops>=0.8",
    "gatr",
    "numpy>=2.5.3",
    "opt-einsum>=3.4",
    "torch>=2.14.0",
    "torch-geometric>=2.7,<3",
]

[tool.uv]
# Pinned GATr's runtime uses SDPA for unmasked attention, but its old package
# metadata requires xFormers and NumPy <1.25 on every platform. Keep the source
# pinned while declaring the dependencies used by this fixed architecture.
[[tool.uv.dependency-metadata]]
name = "gatr"
version = "1.4.2"
requires-dist = ["einops>=0.8", "numpy>=2.5.3", "opt-einsum>=3.4", "torch>=2.14"]

[tool.uv.sources]
cliffordlayers = { git = "https://github.com/microsoft/cliffordlayers.git", rev = "74799cf4588a065916305bfcf2f030d84918f0ad" }
gatr = { git = "https://github.com/Qualcomm-AI-research/geometric-algebra-transformer.git", rev = "6afc26f26b8fcf51136ae8c1d264a36e14b6e497" }

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
